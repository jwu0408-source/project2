<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>연락처 관리 서비스</title>
  <style>
    :root {
      --bg: #f8f2df;
      --card: rgba(255,248,221,0.92);
      --text: #3f2a15;
      --muted: #7c5c3b;
      --primary: #ff8f2f;
      --primary-strong: #ff6b1a;
      --pink: #ff6fa6;
      --green: #4fb46b;
      --shadow: 0 22px 50px rgba(92, 48, 16, 0.2);
      --ink: #4d2b13;
      --panel: #fff9eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,143,47,0.22), transparent 28%),
        radial-gradient(circle at bottom right, rgba(255,111,166,0.18), transparent 24%),
        linear-gradient(135deg, #fff7df 0%, #ffe8b8 45%, #fff2ef 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
    }
    .phone-shell {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(145deg, rgba(255,248,221,0.99), rgba(248,232,191,0.96));
      border: 4px solid #d8a35d;
      border-radius: 34px;
      box-shadow: 0 24px 60px rgba(92, 48, 16, 0.22), inset 0 2px 0 rgba(255,255,255,0.78), inset 0 -2px 0 rgba(152,97,34,0.16);
      padding: 20px;
      backdrop-filter: blur(22px);
      position: relative;
      overflow: hidden;
    }
    .phone-shell::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 28px;
      border: 1px solid rgba(184,116,30,0.24);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45), inset 0 0 20px rgba(255,143,47,0.08);
      pointer-events: none;
    }
    .phone-shell::after {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 18px solid rgba(184,116,30,0.08);
      border-left-color: transparent;
      border-top-color: transparent;
      transform: rotate(18deg);
      pointer-events: none;
    }
    .hero {
      background: linear-gradient(120deg, #ffb347 0%, #ff7b3d 45%, #ff5f9e 100%);
      color: white;
      border-radius: 24px;
      padding: 22px 20px;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.24);
    }
    .hero h1 { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
    .hero p { margin: 0; opacity: 0.95; font-size: 14px; line-height: 1.5; }
    .card {
      background: linear-gradient(145deg, #fffdf4, #fef4d8);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 10px 24px rgba(92, 48, 16, 0.08), inset 0 1px 0 rgba(255,255,255,0.8);
      border: 1px solid rgba(184,116,30,0.2);
      position: relative;
      overflow: hidden;
    }
    #auth-section {
      background:
        linear-gradient(135deg, rgba(255,244,221,0.9), rgba(224,186,127,0.84)),
        repeating-linear-gradient(90deg, rgba(95,58,20,0.08) 0 2px, transparent 2px 16px),
        linear-gradient(120deg, #7b4b20, #b77a3a 45%, #e3b06c 100%);
      border: 3px solid #6b3f16;
      box-shadow: 0 14px 32px rgba(76, 40, 12, 0.22), inset 0 2px 0 rgba(255,255,255,0.4), inset 0 -2px 0 rgba(79,43,12,0.22);
      position: relative;
    }
    #auth-section::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.32);
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(91,54,18,0.16);
    }
    #auth-section::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.12) 35%, transparent 70%);
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 8px;
      border-radius: 16px;
      border: 1px dashed rgba(184,116,30,0.2);
      pointer-events: none;
    }
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 12px;
      right: 12px;
      height: 8px;
      border-radius: 0 0 999px 999px;
      background: linear-gradient(90deg, rgba(255,143,47,0.16), rgba(255,111,166,0.16), rgba(255,143,47,0.16));
      pointer-events: none;
    }
    .label { font-size: 12px; font-weight: 800; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.12em; }
    input, select {
      width: 100%;
      border: 1px solid #e5eaf8;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 14px;
      background: linear-gradient(145deg, #fffdf7, #f7ebcf);
      color: var(--ink);
      box-shadow: inset 0 1px 2px rgba(92, 48, 16, 0.1), inset 0 -1px 0 rgba(255,255,255,0.65);
      border: 1px solid rgba(184,116,30,0.16);
    }
    button {
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(120deg, var(--primary), var(--primary-strong)); color: white; box-shadow: 0 10px 20px rgba(255,107,26,0.2); }
    .btn-soft { background: #fff0cf; color: var(--primary-strong); }
    .btn-danger { background: #ffe4ee; color: #c94b76; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .auth-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 52px;
      border-radius: 16px;
      font-size: 14px;
    }
    .icon-btn .emoji { font-size: 18px; }
    #auth-section, #main-section { display: none; }
    #message { min-height: 1.4rem; margin-top: 8px; font-size: 13px; color: var(--green); }
    .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip { background: #fff0cf; color: var(--primary-strong); padding: 6px 10px; border-radius: 999px; font-size: 12px; }
    .category-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff0cf;
      color: var(--primary-strong);
      font-size: 12px;
    }
    .category-chip button {
      border: none;
      background: transparent;
      color: #c94b76;
      padding: 0;
      font-size: 12px;
      cursor: pointer;
      font-weight: 700;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    thead { background: linear-gradient(135deg, #fff0cf, #ffe4b8); }
    th { text-align: center; padding: 14px 8px; font-weight: 700; color: var(--primary-strong); border: none; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f0f2f7; transition: background 0.15s ease; }
    tbody tr:hover { background: rgba(255,143,47,0.06); }
    tbody tr:nth-child(even) { background: rgba(255,248,221,0.3); }
    td { text-align: center; padding: 14px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-name { font-weight: 600; color: var(--ink); }
    .contact-phone { font-family: 'Courier New', monospace; color: var(--primary-strong); }
    .contact-category { color: var(--primary-strong); font-weight: 500; }
    .contact-actions { white-space: normal; padding: 10px 8px; }
    .contact-actions button { margin: 0 4px; }
    .muted { color: var(--muted); font-size: 12px; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: linear-gradient(145deg, #fffdf4, #fef4d8);
      border-radius: 22px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(92, 48, 16, 0.3);
      border: 2px solid #d8a35d;
    }
    .modal-content h2 { margin-top: 0; color: var(--primary-strong); }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="hero">
      <h1>연락처 관리</h1>
      <p>당신만의 연락처를 더 쉽고 예쁘게 정리해보세요.</p>
    </div>

    <div id="auth-section" class="card">
      <div class="label">Welcome</div>
      <div style="font-size: 12px; margin-bottom: 4px; color: var(--muted);">ID:</div>
      <input id="username" placeholder="영문 소문자·숫자 4~20자" />
      <div style="font-size: 12px; margin-bottom: 4px; color: var(--muted);">PASSWORD:</div>
      <input id="password" type="password" placeholder="4~20자" />
      <div class="auth-actions">
        <button class="btn-primary icon-btn" onclick="login()"><span class="emoji">🔐</span> 로그인</button>
        <button class="btn-soft icon-btn" onclick="signup()"><span class="emoji">✉️</span> 가입</button>
      </div>
      <div id="message"></div>
    </div>

    <div id="main-section">
      <div class="card">
        <div class="row" style="align-items:center; justify-content:space-between; margin-bottom:8px;">
          <div>
            <div class="label">Contacts</div>
            <strong>연락처 관리</strong>
            <div class="muted" style="margin-top: 4px;">로그인 ID: <span id="current-user"></span></div>
          </div>
          <button class="btn-soft" onclick="logout()">로그아웃</button>
        </div>
        <div id="contact-form"></div>
        <input id="search-name" placeholder="이름 검색" />
        <div class="row">
          <button class="btn-primary" onclick="loadContacts()">검색</button>
          <button class="btn-soft" onclick="loadContacts(true)">전체</button>
        </div>
        <div id="contact-list"></div>
      </div>
      <div class="card">
        <div class="label">Categories</div>
        <input id="category-name" placeholder="카테고리 이름" />
        <button class="btn-primary" onclick="createCategory()">카테고리 추가</button>
        <div id="category-list" class="chip-list"></div>
      </div>
    </div>

    <!-- Contact Edit Modal -->
    <div id="edit-modal" class="modal">
      <div class="modal-content">
        <h2>연락처 정보 수정</h2>
        <div class="label">이름</div>
        <input id="edit-modal-name" placeholder="이름" />
        <div class="label">전화번호</div>
        <input id="edit-modal-phone" placeholder="01012345678" />
        <div class="label">주소</div>
        <input id="edit-modal-addr" placeholder="주소" />
        <div class="label">종류</div>
        <select id="edit-modal-category"></select>
        <div class="modal-actions">
          <button class="btn-primary" onclick="saveEditModal()">저장</button>
          <button class="btn-soft" onclick="closeEditModal()">취소</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = null;
    let currentUsername = null;
    let categories = [];
    let editingContactId = null;
    let editingPhoneContactId = null;
    let editingModalContactId = null;

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      const res = await fetch(path, {
        ...options,
        headers,
        credentials: 'include'
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
      if (!res.ok) {
        throw new Error(data?.detail || '요청 실패');
      }
      return data;
    }

    function showMessage(msg, isError = false) {
      const el = document.getElementById('message');
      el.textContent = msg;
      el.style.color = isError ? 'red' : 'green';
    }

    async function init() {
      token = localStorage.getItem('token');
      currentUsername = localStorage.getItem('username');
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('main-section').style.display = 'none';

      if (!token) {
        return;
      }

      try {
        const me = await api('/auth/me');
        if (me) {
          currentUsername = me.username;
          document.getElementById('current-user').textContent = currentUsername;
          document.getElementById('auth-section').style.display = 'none';
          document.getElementById('main-section').style.display = 'block';
          await loadCategories();
          await loadContacts();
        }
      } catch (e) {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        token = null;
        currentUsername = null;
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('main-section').style.display = 'none';
      }
    }

    async function signup() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        await api('/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        showMessage('가입 완료! 로그인해 주세요');
      } catch (e) {
        showMessage(e.message, true);
      }
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const data = await api('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        token = data.access_token;
        currentUsername = username;
        localStorage.setItem('token', token);
        localStorage.setItem('username', username);
        document.getElementById('current-user').textContent = username;
        showMessage('로그인 성공');
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('main-section').style.display = 'block';
        await loadCategories();
        await loadContacts();
      } catch (e) {
        showMessage(e.message, true);
      }
    }

    async function logout() {
      try {
        await api('/auth/logout', { method: 'POST' });
      } catch (e) {}
      token = null;
      currentUsername = null;
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('main-section').style.display = 'none';
    }

    async function loadCategories() {
      categories = await api('/categories');
      const list = document.getElementById('category-list');
      list.innerHTML = categories.map(c => `
        <span class="category-chip">
          <span>${c.name}</span>
          <button type="button" onclick="deleteCategory(${c.id})" aria-label="카테고리 삭제">×</button>
        </span>
      `).join('');
      renderContactForm();
    }

    function renderContactForm() {
      const form = document.getElementById('contact-form');
      const categoryOptions = categories.map(c => `<option value="${c.id}" ${c.id === categories[0]?.id ? 'selected' : ''}>${c.name}</option>`).join('');
      form.innerHTML = `
        <div class="label">New Contact</div>
        <input id="contact-name" placeholder="이름" />
        <input id="contact-phone" placeholder="01012345678" />
        <input id="contact-addr" placeholder="주소" />
        <select id="contact-category">${categoryOptions}</select>
        <button class="btn-primary" onclick="saveContact()">${editingContactId ? '저장' : '추가'}</button>
      `;
    }

    async function saveContact() {
      const payload = {
        name: document.getElementById('contact-name').value,
        phone: document.getElementById('contact-phone').value,
        addr: document.getElementById('contact-addr').value,
        category_id: Number(document.getElementById('contact-category').value),
      };
      try {
        if (editingContactId) {
          await api(`/contacts/${editingContactId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          editingContactId = null;
        } else {
          await api('/contacts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        }
        await loadContacts();
        renderContactForm();
      } catch (e) {
        showMessage(e.message, true);
      }
    }

    async function loadContacts(showAll = false) {
      const name = showAll ? '' : document.getElementById('search-name').value;
      const contacts = await api(`/contacts${name ? `?name=${encodeURIComponent(name)}` : ''}`);
      const list = document.getElementById('contact-list');
      list.innerHTML = `
        <p class="muted">총 ${contacts.length}건</p>
        <table>
          <thead>
            <tr>
              <th style="width: 12%;">이름</th>
              <th style="width: 22%;">전화</th>
              <th style="width: 22%;">주소</th>
              <th style="width: 12%;">종류</th>
              <th style="width: 32%;">관리</th>
            </tr>
          </thead>
          <tbody>
            ${contacts.map(c => `
              <tr>
                <td><span class="contact-name">${c.name}</span></td>
                <td><span class="contact-phone">${c.phone}</span></td>
                <td><span class="muted">${c.addr}</span></td>
                <td><span class="contact-category">${categories.find(cat => cat.id === c.category_id)?.name || '-'}</span></td>
                <td class="contact-actions">
                  <button class="btn-soft" onclick="startEdit(${c.id})">수정</button>
                  <button class="btn-danger" onclick="deleteContact(${c.id})">삭제</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }

    async function createCategory() {
      const name = document.getElementById('category-name').value;
      try {
        await api('/categories', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
        document.getElementById('category-name').value = '';
        await loadCategories();
        await loadContacts();
      } catch (e) {
        showMessage(e.message, true);
      }
    }

    async function deleteCategory(id) {
      if (!confirm('이 카테고리를 삭제하시겠습니까?')) return;
      try {
        await api(`/categories/${id}`, { method: 'DELETE' });
        await loadCategories();
        await loadContacts();
      } catch (e) {
        showMessage(e.message, true);
      }
    }

    async function startEdit(id) {
      const contacts = await api('/contacts');
      const contact = contacts.find(c => c.id === id);
      if (!contact) return;

      editingModalContactId = id;
      document.getElementById('edit-modal-name').value = contact.name;
      document.getElementById('edit-modal-phone').value = contact.phone;
      document.getElementById('edit-modal-addr').value = contact.addr;

      const categorySelect = document.getElementById('edit-modal-category');
      categorySelect.innerHTML = categories.map(c =>
        `<option value="${c.id}" ${c.id === contact.category_id ? 'selected' : ''}>${c.name}</option>`
      ).join('');

      document.getElementById('edit-modal').classList.add('active');
      document.getElementById('edit-modal-name').focus();
    }

    async function deleteContact(id) {
      if (!confirm('삭제하시겠습니까?')) return;
      try {
        await api(`/contacts/${id}`, { method: 'DELETE' });
        editingContactId = null;
        renderContactForm();
        await loadContacts();
        showMessage('삭제 완료! 새로운 연락처를 추가할 수 있습니다.');
      } catch (e) {
        showMessage(e.message, true);
      }
    }

    function openPhoneModal(id, name, phone) {
      editingPhoneContactId = id;
      document.getElementById('modal-contact-id').textContent = `ID: ${id}`;
      document.getElementById('modal-contact-name').textContent = `${name}`;
      document.getElementById('modal-phone').value = phone;
      document.getElementById('phone-modal').classList.add('active');
      document.getElementById('modal-phone').focus();
    }

    function closePhoneModal() {
      editingPhoneContactId = null;
      document.getElementById('phone-modal').classList.remove('active');
      document.getElementById('modal-phone').value = '';
    }

    async function updatePhoneNumber() {
      const newPhone = document.getElementById('modal-phone').value;
      if (!newPhone) {
        showMessage('전화번호를 입력하세요', true);
        return;
      }
      try {
        await api(`/contacts/${editingPhoneContactId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: newPhone })
        });
        closePhoneModal();
        await loadContacts();
        showMessage('전화번호 수정 완료!');
      } catch (e) {
        showMessage(e.message, true);
      }
    }

    function closeEditModal() {
      editingModalContactId = null;
      document.getElementById('edit-modal').classList.remove('active');
      document.getElementById('edit-modal-name').value = '';
      document.getElementById('edit-modal-phone').value = '';
      document.getElementById('edit-modal-addr').value = '';
    }

    async function saveEditModal() {
      const payload = {
        name: document.getElementById('edit-modal-name').value,
        phone: document.getElementById('edit-modal-phone').value,
        addr: document.getElementById('edit-modal-addr').value,
        category_id: Number(document.getElementById('edit-modal-category').value),
      };

      if (!payload.name || !payload.phone || !payload.addr) {
        showMessage('모든 항목을 입력하세요', true);
        return;
      }

      try {
        await api(`/contacts/${editingModalContactId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        closeEditModal();
        await loadContacts();
        editingContactId = null;
        renderContactForm();
        showMessage('연락처 수정 완료!');
      } catch (e) {
        showMessage(e.message, true);
      }
    }

    // 모달 외부 클릭 시 닫기
    document.addEventListener('click', function(event) {
      const phoneModal = document.getElementById('phone-modal');
      const editModal = document.getElementById('edit-modal');
      if (event.target === phoneModal) {
        closePhoneModal();
      }
      if (event.target === editModal) {
        closeEditModal();
      }
    });

    // Enter 키로 저장
    document.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        if (editingPhoneContactId) {
          updatePhoneNumber();
        } else if (editingModalContactId) {
          saveEditModal();
        }
      }
    });

    window.addEventListener('load', init);
  </script>
